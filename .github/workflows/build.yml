name: Build NexoraTV (Android natif)

on:
  push:
    branches: [main]
    tags: ["tv-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runners CI = plus de RAM (le gradle.properties local est bridé 4 Go)
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=false"
            echo "android.useAndroidX=true"
            echo "android.nonTransitiveRClass=true"
            echo "android.nonFinalResIds=true"
            echo "kotlin.code.style=official"
          } > gradle.properties

      - name: Clé de signature release (si présente)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > nexoratv-tv-release.jks
          cat > keystore.properties <<EOF
          storeFile=nexoratv-tv-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build debug
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Renommer l'APK
        run: |
          set -e
          out=$(find app/build/outputs/apk -name "*.apk" | head -1)
          v=$(grep -m1 versionName app/build.gradle.kts | sed 's/[^0-9.]//g')
          cp "$out" "NexoraTV-TV-$v.apk"
          cp "$out" "NexoraTV-TV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: NexoraTV-TV*.apk

      - name: Publier la Release (sur tag tv-v*)
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: NexoraTV-TV*.apk
