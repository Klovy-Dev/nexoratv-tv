name: Build NexoraTV (Android natif)

on:
  push:
    branches: [main]
    tags: ["tv-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cohérence des versions (sur tag tv-v*)
        if: startsWith(github.ref, 'refs/tags/tv-v')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#tv-v}"
          gradle=$(grep -m1 'versionName = ' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          manifest=$(python3 -c "import json,sys; print(json.load(open('update.json'))['versionName'])")
          echo "tag=$tag · build.gradle=$gradle · update.json=$manifest"
          if [ "$tag" != "$gradle" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::versions incohérentes (tag/build.gradle/update.json)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Le cache restauré s'est corrompu sur un run interrompu
          # (« Corrupt serialized resolution result »). Désactivé le temps
          # de stabiliser, à réactiver ensuite.
          cache-disabled: true

      - name: Runners CI = plus de RAM (le gradle.properties local est bridé 4 Go)
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=false"
            echo "android.useAndroidX=true"
            echo "android.nonTransitiveRClass=true"
            echo "android.nonFinalResIds=true"
            echo "kotlin.code.style=official"
          } > gradle.properties

      # Signature debug STABLE entre les runs : sans ça, chaque build CI est
      # signé par un keystore debug auto-généré différent → les mises à jour
      # intégrées refusent de s'installer (signatures différentes). Ce keystore
      # est un keystore *debug* (mot de passe public « android »), pas secret.
      # `app/build.gradle.kts` pointe explicitement sur `ci/debug.keystore`.
      - name: Keystore debug partagé
        run: base64 -d ci/debug.keystore.b64 > ci/debug.keystore

      - name: Clé de signature release (si présente)
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > nexoratv-tv-release.jks
          cat > keystore.properties <<EOF
          storeFile=nexoratv-tv-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      # Tant que R8/proguard n'est pas éprouvé (pré-1.0), on publie du debug
      # (installable, sideloadable ; juste debuggable).
      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Renommer l'APK
        run: |
          set -e
          out=$(find app/build/outputs/apk -name "*.apk" | head -1)
          v=$(grep -m1 'versionName = ' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          cp "$out" "NexoraTV-TV-$v.apk"
          cp "$out" "NexoraTV-TV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: NexoraTV-TV*.apk

      - name: Publier la Release (sur tag tv-v*)
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: NexoraTV-TV*.apk
