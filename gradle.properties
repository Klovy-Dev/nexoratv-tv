# Machine à faible RAM (~4 Go) : plafonds bas, sinon le daemon Gradle / les
# workers de dexing font un OutOfMemoryError et corrompent leur sortie
# (« Problems reading data from Binary store »).
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configuration-cache=false

kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Dexing hors process = un JVM séparé qui respecte moins bien les plafonds ;
# sur cette machine on garde le dexing dans le process Gradle.
android.enableR8.fullMode=false

kotlin.code.style=official
